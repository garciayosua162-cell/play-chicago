<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Play Chicago</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:Arial;color:white;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#6d7a83}
#hud{position:fixed;top:12px;left:12px;text-shadow:0 2px 4px #000;font-weight:bold}
#msg{position:fixed;top:42px;left:12px;font-size:13px}
#joy{position:fixed;left:22px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55}
#stick{position:absolute;left:42px;top:42px;width:46px;height:46px;border-radius:50%;background:#ffffffaa}
#run{position:fixed;right:25px;bottom:35px;width:92px;height:92px;border-radius:50%;border:2px solid #fff8;background:#222b;color:#fff;font-size:36px}
#cam{position:fixed;right:28px;top:18px;border:1px solid #fff8;background:#222b;color:white;border-radius:12px;padding:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">PLAY CHICAGO<br>❤️ 100 &nbsp; 💵 $500</div>
<div id="msg">Prototipo 3D móvil • Arrastra el control para caminar</div>
<div id="joy"><div id="stick"></div></div>
<button id="run">🏃</button><button id="cam">CAM</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}resize();addEventListener('resize',resize);
let px=0,py=0,rx=0,ry=0,running=false,cam=0,keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let jid=null,jx=0,jy=0;
function moveJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(45,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);jx=Math.cos(a)*m/45;jy=Math.sin(a)*m/45;stick.style.transform=`translate(${jx*42}px,${jy*42}px)`}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===jid)moveJoy(e)};joy.onpointerup=joy.onpointercancel=()=>{jid=null;jx=jy=0;stick.style.transform=''};
const run=document.getElementById('run');run.onpointerdown=()=>running=true;run.onpointerup=run.onpointercancel=()=>running=false;
document.getElementById('cam').onclick=()=>cam=1-cam;
function loop(){
let ax=jx+(keys.d?1:0)-(keys.a?1:0),ay=jy+(keys.s?1:0)-(keys.w?1:0),sp=running?4:2;px+=ax*sp;py+=ay*sp;
x.clearRect(0,0,W,H);
let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#778894');g.addColorStop(.55,'#b8c0c3');g.addColorStop(.551,'#303338');g.addColorStop(1,'#17191d');x.fillStyle=g;x.fillRect(0,0,W,H);
let horizon=H*.52, offx=((px*7)%160),offy=((py*4)%120);
for(let i=-2;i<12;i++){let bx=i*170-offx;let bh=80+((i*37)%120+120);x.fillStyle=['#333a42','#454b51','#252b31'][Math.abs(i)%3];x.fillRect(bx,horizon-bh,125,bh);for(let yy=horizon-bh+15;yy<horizon-10;yy+=22)for(let xx=bx+12;xx<bx+115;xx+=22){x.fillStyle='#c5c9a455';x.fillRect(xx,yy,9,10)}}
x.fillStyle='#292b30';x.fillRect(0,horizon,W,H-horizon);
x.strokeStyle='#e8d75d';x.lineWidth=4;x.setLineDash([35,25]);x.beginPath();x.moveTo(0,horizon+55);x.lineTo(W,horizon+55);x.stroke();x.setLineDash([]);
for(let i=0;i<7;i++){let vx=(i*180+offx*1.5)% (W+220)-100,vy=horizon+20+(i%3)*65-offy; x.fillStyle=i%2?'#d8d8d8':'#b62e2e';x.fillRect(vx,vy,62,30);x.fillStyle='#111';x.fillRect(vx+8,vy+5,18,10);x.fillRect(vx+36,vy+5,18,10)}
// player
let cx=W/2,cy=H*.72; x.fillStyle='#0008';x.beginPath();x.ellipse(cx,cy+25,22,8,0,0,7);x.fill();x.fillStyle='#111';x.fillRect(cx-13,cy-5,26,38);x.fillStyle='#e0b08b';x.beginPath();x.arc(cx,cy-17,13,0,7);x.fill();x.fillStyle='#151515';x.beginPath();x.arc(cx,cy-22,14,Math.PI,7);x.fill();x.fillStyle='#222';x.fillRect(cx-20,cy-30,40,5);
x.fillStyle='#fff';x.font='bold 14px Arial';x.textAlign='center';x.fillText(cam?'3RD PERSON':'3D',cx,cy+55);
requestAnimationFrame(loop)}loop();
</script></body></html>
